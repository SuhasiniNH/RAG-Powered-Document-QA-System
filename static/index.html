<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF QnA Bot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; padding: 10px 20px; }
    #answer { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>📄 PDF QnA Bot</h1>
  <textarea id="question" placeholder="Ask a question about the PDF..."></textarea>
  <br>
  <button onclick="ask()">🔍 Get Answer</button>

  <div id="answer"></div>

  <script>
  async function ask() {
    const question = document.getElementById("question").value;
    if (!question) {
      alert("Please enter a question!");
      return;
    }

    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });

    const data = await response.json();
    document.getElementById("answer").innerHTML =
      "<b>Answer:</b> " + data.answer + "<br><br>"
  }
</script>

</body>
</html>
